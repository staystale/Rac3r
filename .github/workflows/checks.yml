name: checks

# The regression suite on every push: the proof hashes (level data, simulation, pixels) are saved on
# the base commit, then the pushed commit is compared against them. A change that is meant to alter
# behaviour or looks says so in its commit message - [sim] (the simulation / the AI), [world] (level
# data), [look] (pixels) - and that hash is then REPORTED, not failed (the next push compares
# against it). An untagged difference fails: something changed that was not meant to. The
# runners have no GPU: the WebGL2 ground runs in software (SwiftShader), ~3-6 min a level, so
# the pixel check (renderhash) is its own job split over 4 machines (--shard): every level on
# every push.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHECK_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Proof references from the base commit
        run: |
          BASE=$(git merge-base origin/main HEAD)
          if [ "$BASE" = "$(git rev-parse HEAD)" ]; then BASE=$(git rev-parse HEAD~1); fi
          echo "base: $BASE"
          git worktree add ../base "$BASE"
          ln -s "$PWD/node_modules" ../base/node_modules
          (cd ../base && node tools/worldhash.mjs --highway 20 save && node tools/simhash.mjs save)
          cp ../base/tools/.worldhash ../base/tools/.simhash tools/
      - name: Intended changes (a [sim] / [world] tag in the pushed commits)
        run: |
          BASE=$(git merge-base origin/main HEAD)
          if [ "$BASE" = "$(git rev-parse HEAD)" ]; then BASE=$(git rev-parse HEAD~1); fi
          MSGS=$(git log --format=%B "$BASE..HEAD")
          for tag in sim world; do
            if echo "$MSGS" | grep -qF "[$tag]"; then echo "TAG_$tag=1" >> "$GITHUB_ENV"; echo "[$tag]: reported only"; fi
          done
      - run: node tools/runall.mjs --skip renderhash,simhash,worldhash
      - name: simhash
        if: always()
        continue-on-error: ${{ env.TAG_sim == '1' }}
        run: node tools/simhash.mjs
      - name: worldhash
        if: always()
        continue-on-error: ${{ env.TAG_world == '1' }}
        run: node tools/worldhash.mjs --highway 20

  renderhash:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CHECK_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pixel reference from the base commit (this shard's levels)
        run: |
          BASE=$(git merge-base origin/main HEAD)
          if [ "$BASE" = "$(git rev-parse HEAD)" ]; then BASE=$(git rev-parse HEAD~1); fi
          echo "base: $BASE"
          git worktree add ../base "$BASE"
          ln -s "$PWD/node_modules" ../base/node_modules
          # this commit's renderhash.mjs, so a base from before --shard splits the levels the same
          cp tools/renderhash.mjs ../base/tools/renderhash.mjs
          (cd ../base && node tools/renderhash.mjs save --shard ${{ matrix.shard }}/4)
          cp ../base/tools/.renderhash tools/
      - name: Intended change (a [look] tag in the pushed commits)
        run: |
          BASE=$(git merge-base origin/main HEAD)
          if [ "$BASE" = "$(git rev-parse HEAD)" ]; then BASE=$(git rev-parse HEAD~1); fi
          if git log --format=%B "$BASE..HEAD" | grep -qF "[look]"; then echo "TAG_look=1" >> "$GITHUB_ENV"; echo "[look]: reported only"; fi
      - name: renderhash
        continue-on-error: ${{ env.TAG_look == '1' }}
        run: node tools/renderhash.mjs --shard ${{ matrix.shard }}/4
