<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1d22">
<!-- "Add to Home Screen" opens full screen, without Safari's bars and most of its gestures (a
     judder test before an app wrapper; no start_url, so the icon keeps the link's settings) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RAC3R">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2713%27 font-size=%2713%27%3E%F0%9F%8F%8E%3C/text%3E%3C/svg%3E">
<title>RAC3R</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #1b1d22;
    /* a stray text selection or long-press menu mid-drift is a lost drift */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Tap-to-start. Needed for the audio context later, and it stops a phone's first tap being eaten. */
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; background: #1b1d22; color: #e8e8ee; z-index: 10;
  }
  #boot h1 { font-size: 22px; font-weight: 650; letter-spacing: .14em; }
  #boot p { font-size: 13px; opacity: .6; letter-spacing: .04em; }
  #boot.gone { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- THE BOOT BAR (game/bootbar.ts drives it once the code has run): the
     loading screen's pane and bar from the first paint, over the boot screen. Its look is
     menu/loadscreen.ts's, copied here in plain CSS (the code has not loaded yet); its words take
     their own copies of the menu's faces (menu/pixelstyle.ts), and show once those have loaded
     (font-display: block - the pane and the bar show at once; a face slower than ~3 s shows a
     monospace stand-in until it comes). -->
<template id="bootbar-page">
<style>
  @font-face { font-family: R3BootSmall; src: url(assets/fonts/vt323.woff2) format("woff2");
    font-display: block; }
  @font-face { font-family: R3BootTitle; src: url(assets/fonts/silkscreen-700.woff2)
    format("woff2"); unicode-range: U+0030-0039; font-display: block; }
  @font-face { font-family: R3BootTitle; src: url(assets/fonts/press-start-2p.woff2)
    format("woff2"); unicode-range: U+0000-002F, U+003A-FFFF; font-display: block; }
  #bootbar { position: fixed; inset: 0; z-index: 25; display: flex; align-items: center;
    justify-content: center; background: #101116; touch-action: none; pointer-events: auto; }
  #bootbar .pane { width: min(440px, calc(100% - 48px)); padding: 16px; display: flex;
    flex-direction: column; gap: 12px; background: rgba(12,11,16,.95); border: 2px solid #000;
    box-shadow: inset 0 0 0 2px #3a2018, 6px 6px 0 rgba(0,0,0,.6); }
  #bootbar .what { font-family: R3BootSmall, monospace; font-size: 18px; color: #b3a39b;
    letter-spacing: .02em; }
  #bootbar .name { position: relative; font-family: R3BootTitle, monospace;
    font-size: clamp(14px, 4.2vw, 22px); line-height: 1.35; letter-spacing: .02em;
    color: #ff4a1a; text-shadow: 2px 2px 0 #000, 3px 3px 0 #5a2f1c; }
  /* the owner's logo (the main menu's), its box kept from the first paint so nothing moves when
     it comes; until then the name in words, its 3 big and in the logo's blue */
  #bootbar .logo { display: block; width: 100%; max-height: 42vh; aspect-ratio: 1200 / 556;
    object-fit: contain; visibility: hidden; }
  #bootbar .name.ready .logo { visibility: visible; }
  #bootbar .word { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: clamp(22px, 7vw, 40px); }
  #bootbar .name.ready .word { display: none; }
  /* ?logofade=1: no words first - the logo's box empty until it has come, then faded in; the words
     only if it has not come in LOGO_LATE_MS or fails */
  #bootbar .name.fade .word { visibility: hidden; }
  #bootbar .name.fade.late .word { visibility: visible; }
  #bootbar .name.fade .logo { visibility: visible; opacity: 0; transition: opacity 150ms linear; }
  #bootbar .name.fade.ready .logo { opacity: 1; }
  #bootbar .three { color: #35c4ff; font-size: 1.9em; line-height: 1;
    text-shadow: 2px 2px 0 #000, 3px 3px 0 #0b3b66; }
  #bootbar .well { height: 18px; background: #241c23; border: 2px solid #000;
    box-shadow: inset 0 0 0 2px #3a2018; overflow: hidden; }
  #bootbar .fill { height: 100%; background: #ff7a2a; transform-origin: 0 50%;
    transform: scaleX(0); will-change: transform; }
</style>
<div id="bootbar"><div class="pane"><div class="what">LOADING</div><div class="name"><img class="logo"
  src="assets/logo.jpg" alt=""><div class="word">RAC<span class="three">3</span>R</div></div>
  <div class="well"><div class="fill"></div></div></div></div>
</template>
<script>
  // the boot bar up before the first paint, its bar easing (on the compositor, so it
  // moves while the code downloads and runs) toward the code's share of the whole wait, over the
  // time the code took here the last time (game/bootbar.ts keeps it), else a guess; the share and
  // the menu's own wait left on the screen for the code to carry on from
  // (not for the test tools - navigator.webdriver, as the bundle below: they click to start at once,
  // and the bar would take that click; tools/scratch/_bootbarshots.mjs hides the flag to see it)
  (() => {
    if (navigator.webdriver) return;
    const params = new URLSearchParams(location.search);
    const page = document.getElementById('bootbar-page').content;
    // (?logofade=1: the logo asked for first, ahead of the code)
    const isFade = params.get('logofade') === '1';
    if (isFade) page.querySelector('.logo').fetchPriority = 'high';
    document.body.appendChild(page.cloneNode(true));
    let last = null;
    try {
      last = JSON.parse(localStorage.getItem('rac3r.bootbar') || 'null');
    } catch {
      last = null;
    }
    const codeMs = Math.max(200, Number(last && last.codeMs) || 3000);
    const readyMs = Math.max(100, Number(last && last.readyMs) || 600);
    const share = Math.min(0.95, Math.max(0.5, codeMs / (codeMs + readyMs)));
    const bar = document.getElementById('bootbar'), fill = bar.querySelector('.fill');
    bar.dataset.share = share;
    bar.dataset.readyMs = readyMs;
    // (the logo shown once it has come; a logo that fails leaves the words - with ?logofade=1 the
    // words only after LOGO_LATE_MS, 3 s, or the logo failing)
    const logo = bar.querySelector('.logo'), name = bar.querySelector('.name');
    const showLogo = () => {
      if (logo.naturalWidth) name.classList.add('ready');
      else name.classList.add('late');
    };
    if (isFade) {
      name.classList.add('fade');
      setTimeout(() => name.classList.add('late'), 3000);
    }
    if (logo.complete) showLogo();
    else {
      logo.addEventListener('load', showLogo);
      logo.addEventListener('error', showLogo);
    }
    // (the empty bar laid out first, so it eases from empty; 0.9: loading.ts CREEP_SHARE)
    void fill.offsetWidth;
    fill.style.transition = 'transform ' + Math.round(codeMs) + 'ms ease-out';
    fill.style.transform = 'scaleX(' + share * 0.9 + ')';
  })();
</script>
<div id="boot"><h1>RAC3R</h1><p>loading…</p></div>
<script type="module">
  // the game as ONE file the test server builds (serve.mjs /__bundle.js) instead of ~160 modules
  // (default since 2026-10-17, owner approved; ?bundle=0 = the modules); the test tools
  // (navigator.webdriver) always load the modules. The itch.io build replaces both paths with its
  // own bundle (tools/build.mjs).
  const bundled = new URLSearchParams(location.search).get('bundle') !== '0'
    && !navigator.webdriver;
  import(bundled ? './__bundle.js' : './src/main.ts').catch((err) => {
    // (the boot bar taken down, so the error shows)
    const bootBar = document.getElementById('bootbar');
    if (bootBar) bootBar.remove();
    document.querySelector('#boot p').textContent = 'could not load: ' + err.message;
  });
</script>
</body>
</html>
