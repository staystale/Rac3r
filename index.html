<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1d22">
<!-- "Add to Home Screen" opens full screen, without Safari's bars and most of its gestures (a
     judder test before an app wrapper; no start_url, so the icon keeps the link's settings) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RAC3R">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2713%27 font-size=%2713%27%3E%F0%9F%8F%8E%3C/text%3E%3C/svg%3E">
<title>RAC3R</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #1b1d22;
    /* a stray text selection or long-press menu mid-drift is a lost drift */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Tap-to-start. Needed for the audio context later, and it stops a phone's first tap being eaten. */
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; background: #1b1d22; color: #e8e8ee; z-index: 10;
  }
  #boot h1 { font-size: 22px; font-weight: 650; letter-spacing: .14em; }
  #boot p { font-size: 13px; opacity: .6; letter-spacing: .04em; }
  #boot.gone { display: none; }
  /* the menu's background race, a recording (src/game/menuvideo.js) */
  #menuvideo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
    background: #1b1d22; z-index: 5; display: none; pointer-events: none; }
  #menuvideo.on { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="menuvideo" muted playsinline loop aria-hidden="true"></video>
<div id="boot"><h1>RAC3R</h1><p>loading…</p></div>
<script type="module">
  // the game as ONE file the test server builds (serve.mjs /__bundle.js) instead of ~160 modules
  // (default since 2026-10-17, owner approved; ?bundle=0 = the modules); the test tools
  // (navigator.webdriver) always load the modules. The itch.io build replaces both paths with its
  // own bundle (tools/build.mjs).
  const bundled = new URLSearchParams(location.search).get('bundle') !== '0'
    && !navigator.webdriver;
  import(bundled ? './__bundle.js' : './src/main.js').catch((err) => {
    document.querySelector('#boot p').textContent = 'could not load: ' + err.message;
  });
</script>
</body>
</html>
